[package]
name = "grammar-api"
version = "0.1.0"
edition = "2021"
description = "A grammar and spelling checking API using Harper"
license = "MIT"
repository = "https://github.com/example/grammar-api"
keywords = ["grammar", "spelling", "api", "harper"]
categories = ["text-processing", "web-programming"]

[lib]
name = "grammar_api"
path = "src/lib.rs"

[[bin]]
name = "grammar-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harper-core = "0.29"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower_governor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
uuid = { version = "1", features = ["v4"] }
http = "1"

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"
reqwest = { version = "0.12", features = ["json"] }

[lints.rust]
# ALL ERRORS - NO WARNINGS
unsafe_code = "deny"

# Future compatibility - ERRORS
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

# Missing documentation - ERRORS
missing_docs = "deny"
missing_debug_implementations = "deny"

# Code correctness - ERRORS
unused = { level = "deny", priority = -1 }
dead_code = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

# Type safety - ERRORS
trivial_casts = "deny"
trivial_numeric_casts = "deny"

# Async - ERRORS
elided_lifetimes_in_paths = "deny"

# Other strict lints - ERRORS
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
unit_bindings = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[lints.clippy]
# ALL ERRORS - NO WARNINGS
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Transitive dependency version conflicts — not fixable without upstream changes
multiple_crate_versions = "allow"

# Dangerous patterns - ERRORS
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Security-related - ERRORS
mem_forget = "deny"

# Code quality - ERRORS
fn_params_excessive_bools = "deny"

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "deny"
unused_imports = "deny"
dead_code = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_results = "deny"
# Stale #[expect] attributes must be errors, not warnings — no dead suppressions
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
# all + pedantic at maximum — restriction & nursery cherry-picked (contain contradictions)
all                  = { level = "deny", priority = -1 }
pedantic             = { level = "deny", priority = -1 }
unwrap_used          = "deny"
expect_used          = "deny"
panic                = "deny"
todo                 = "deny"
unimplemented        = "deny"
# Implicit panics from out-of-bounds indexing — use .get() instead
indexing_slicing     = "deny"
# Silent lossy type conversions via `as` — use .into()/.try_into() instead
as_conversions       = "deny"
# Forgotten debug macros leaking info to stderr
dbg_macro            = "deny"
# Resource leaks from skipped destructors — use ManuallyDrop if needed
mem_forget           = "deny"
# From impls that can panic should be TryFrom instead
fallible_impl_from   = "deny"
# Catch needless implicit clones — use .clone() for explicit intent
implicit_clone       = "deny"
# Require SAFETY comments on any unsafe block — defense in depth for allowed exceptions
undocumented_unsafe_blocks = "deny"
# Prevent silent precision loss in float literals — critical for numeric type correctness
lossy_float_literal  = "deny"
# Prevent stack overflow from oversized local variables — critical for recursive AST walking
large_stack_frames   = "deny"
# Force #[expect] over #[allow] so stale lint suppressions don't hide new violations
allow_attributes     = "deny"
too_many_lines       = "deny"
too_many_arguments   = "deny"
cast_possible_truncation = "deny"
# Catch accidental infinite loops — require `-> !` return type for intentional ones
infinite_loop        = "deny"
# Prevent silent error cause discarding in .map_err(|_| ...) — preserve error provenance
map_err_ignore       = "deny"
# Prevent process::exit() — use proper error propagation, exit only via main() return
exit                 = "deny"
# Catch struct destructures that silently ignore new fields — critical during refactoring
rest_pat_in_fully_bound_structs = "deny"
# Require Arc::clone(&x) syntax — make ref-counted pointer cloning visually distinct
clone_on_ref_ptr     = "deny"
